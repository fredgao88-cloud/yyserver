user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;

    # 白名单出站代理：仅允许 hospital_internal 隔离网段经 Nginx 转发至钉钉群机器人接口
    server {
        listen 8443;
        server_name _;

        allow 172.18.0.0/16;
        deny all;

        resolver 127.0.0.11 valid=60s ipv6=off;

        location = /robot/send {
            set $dingtalk_upstream "oapi.dingtalk.com";
            proxy_pass https://$dingtalk_upstream$request_uri;
            proxy_ssl_server_name on;
            proxy_ssl_name oapi.dingtalk.com;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 2;
            proxy_set_header Host oapi.dingtalk.com;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location / {
            return 403;
        }
    }
}

# 白名单内网代理：仅允许 hospital_internal 隔离网段经 Nginx 转发至院内 HIS 数据库 (192.168.20.2:1433)
stream {
    server {
        listen 1433;
        allow 172.18.0.0/16;
        deny all;
        proxy_connect_timeout 5s;
        proxy_timeout 600s;
        proxy_pass 192.168.20.2:1433;
    }
}
