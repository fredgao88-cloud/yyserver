user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # NOTIFY-LOG-001：专用脱敏日志格式，仅记录无参数路径 ($uri)，严禁记录含 access_token/sign 的查询串
    log_format  dingtalk_safe  '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent $request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;

    # 白名单出站代理：仅允许 hospital_internal 隔离网段经 Nginx 转发至钉钉群机器人接口
    server {
        listen 8443;
        server_name _;

        include /etc/nginx/internal_allow.conf;

        access_log /var/log/nginx/access.log dingtalk_safe;
        # 上游失败时 Nginx error_log 默认会附加完整 request 行（含 query 参数），仅保留 emerg 级别避免凭据落盘
        error_log /var/log/nginx/dingtalk_error.log emerg;

        resolver 127.0.0.11 valid=60s ipv6=off;

        location = /robot/send {
            set $dingtalk_upstream "oapi.dingtalk.com";
            proxy_pass https://$dingtalk_upstream$request_uri;
            proxy_ssl_server_name on;
            proxy_ssl_name oapi.dingtalk.com;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 2;
            proxy_set_header Host oapi.dingtalk.com;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location / {
            return 403;
        }
    }
}

# 白名单内网代理：仅允许 hospital_internal 隔离网段经 Nginx 转发至院内 HIS 数据库 (192.168.20.2:1433)
stream {
    server {
        listen 1433;
        include /etc/nginx/internal_allow.conf;
        proxy_connect_timeout 5s;
        proxy_timeout 600s;
        proxy_pass 192.168.20.2:1433;
    }
}
