services:
  api:
    build: .
    image: hospital-agent-api:v1.2
    container_name: hospital_agent_api
    restart: unless-stopped
    networks:
      - hospital_internal
    env_file:
      - .env
    environment:
      - ENV=${ENV:-production}
      - PORT=${PORT:-8000}
      - LOCAL_DB_HOST=${LOCAL_DB_HOST:-sqlserver}
      - LOCAL_DB_PORT=${LOCAL_DB_PORT:-1433}
      - LOCAL_DB_USER=${LOCAL_DB_USER:-sa}
      - LOCAL_DB_PASS=${LOCAL_DB_PASS}
      - LOCAL_DB_NAME=${LOCAL_DB_NAME:-his_agent_db}
      - HIS_FREETDS_SECTION=${HIS_FREETDS_SECTION:-hisdb_proxy}
    volumes:
      - ./api:/opt/hospital-agent/api
      - ./agent:/opt/hospital-agent/agent
      - ./auth:/opt/hospital-agent/auth
      - ./db:/opt/hospital-agent/db
      - ./tools:/opt/hospital-agent/tools
      - ./sql:/opt/hospital-agent/sql
      - ./tests:/opt/hospital-agent/tests
      - ./data:/opt/hospital-agent/data
      - ./freetds.conf:/opt/hospital-agent/freetds.conf:ro

  nginx:
    image: nginx:alpine
    container_name: hospital_agent_nginx
    restart: unless-stopped
    networks:
      - hospital_internal
      - hospital_edge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/docker-entrypoint.d/10-internal-allow.sh:/docker-entrypoint.d/10-internal-allow.sh:ro
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

  wg:
    build: ./wireguard
    image: hospital-agent-wg:v1.0
    container_name: hospital_agent_wg
    restart: unless-stopped
    networks:
      - hospital_edge
    ports:
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - WG_ENDPOINT_HOST=${WG_ENDPOINT_HOST:-8b000a4b23ee.sn.mynetname.net}
      - WG_ENDPOINT_PORT=${WG_ENDPOINT_PORT:-51820}
      - WG_WORKBENCH_IP=${WG_WORKBENCH_IP:-192.168.1.100}
    volumes:
      - wireguard_config:/etc/wireguard
    depends_on:
      - nginx

volumes:
  wireguard_config:

networks:
  hospital_internal:
    driver: bridge
    internal: true
  hospital_edge:
    driver: bridge
